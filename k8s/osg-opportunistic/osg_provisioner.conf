[DEFAULT]
# Set to yes when the nodes allow unprivileged user namespaces (needed by apptainer)
apptainer=no
k8s_domain=nrp-nautilus.io
app_name=osg-direct
force_k8s_namespace_matching=no

[k8s]
k8s_image=hub.opensciencegrid.org/ashtongraves/nrp-provisioner-wn:25-test
tolerations_list=nautilus.io/noceph,nautilus.io/chase-ci
priority_class=opportunistic
service_account_name=prp-htcondor-wn-ro
max_submit_pods_per_cluster=300
k8s_job_ttl=3600
use_large_limit=no
labels_dict=applicationId:osg-opportunistic-wn
envs_dict=GLIDEIN_Site:SDSC-PRP,GLIDEIN_ResourceName:SDSC-PRP-OSPool-Provisioner,OSG_SQUID_LOCATION:10.110.90.167&colon;3128
annotations_dict=container.apparmor.security.beta.kubernetes.io/htcondor:unconfined

[htcondor]
schedd_whitelist_regexp=(login.*\.osgconnect\.net)|(.*\.jlab\.org)|(.*\.amnh\.org)|(.*\.grid\.uchicago\.edu)|(ap.*\.osg-htc\.org)
additional_requirements=((DESIRED_Sites is undefined)||stringListMember("SDSC-PRP",DESIRED_Sites,","))&&((UNDESIRED_Sites is undefined)||!stringListMember("SDSC-PRP",UNDESIRED_Sites,","))&&(!isUndefined(ProjectName))&&(RequestMemory<=65536)&&(RequestDisk<=800000000)&&isUndefined(TargetAnnexName)
# Original line, removed the gpu request filter by Derek on 5/5/26
# additional_requirements=((DESIRED_Sites is undefined)||stringListMember("SDSC-PRP",DESIRED_Sites,","))&&((UNDESIRED_Sites is undefined)||!stringListMember("SDSC-PRP",UNDESIRED_Sites,","))&&(!isUndefined(ProjectName))&&(!isUndefined(SingularityImage))&&((RequestGPUs>0)=!=true)&&(RequestMemory<=65536)&&(RequestDisk<=800000000)
