apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: direct-provisioner
  name: direct-provisioner-ligo
  namespace: osg-ligo
spec:
  replicas: 0
  selector:
    matchLabels:
      k8s-app: direct-provisioner
  template:
    metadata:
      labels:
        k8s-app: direct-provisioner
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - mghpcc
                - unl
      containers:
      - env:
        - name: CONDOR_HOST
          value: condor.igwn.org
        - name: K8S_NAMESPACE
          value: osg-ligo
        - name: CVMFS_MOUNTS
          value: singularity
        - name: HTCONDOR_QUERY_INSECURE
          value: 'yes'
        image: hub.opensciencegrid.org/ashtongraves/nrp-provisioner:25-el10-test
        imagePullPolicy: Always
        name: provisioner
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        volumeMounts:
        - mountPath: /etc/condor/tokens.d/prp-wn.token
          name: configpasswd
          readOnly: true
          subPath: prp-wn.token
        - mountPath: /home/provisioner/osg_provisioner.conf
          name: kconf
          subPath: osg_provisioner.conf
        - mountPath: /var/log/provisioner
          name: log-pvc
      serviceAccountName: prp-htcondor-provisioner
      volumes:
      - name: configpasswd
        secret:
          defaultMode: 256
          items:
          - key: prp-wn.token
            path: prp-wn.token
          secretName: prp-htcondor-wn-secret
      - configMap:
          items:
          - key: osg_provisioner.conf
            path: osg_provisioner.conf
          name: direct-provisioner-config
        name: kconf
      - name: log-pvc
        persistentVolumeClaim:
          claimName: direct-provisioner-log-pvc
