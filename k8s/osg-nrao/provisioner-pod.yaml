apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    applicationId: nrp-provisioner
    k8s-app: nrao-provisioner
  name: nrao-provisioner
  namespace: osg-nrao
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: nrao-provisioner
  template:
    metadata:
      labels:
        applicationId: nrp-provisioner
        k8s-app: nrao-provisioner
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - mghpcc
                - unl
      containers:
      - env:
        - name: CONDOR_HOST
          value: cm-1.ospool.osg-htc.org,cm-2.ospool.osg-htc.org
        - name: K8S_NAMESPACE
          value: osg-nrao
        - name: CVMFS_MOUNTS
          value: connect,stash,singularity
        - name: HTCONDOR_QUERY_INSECURE
          value: 'yes'
        image: hub.opensciencegrid.org/ashtongraves/nrp-provisioner:25-release
        imagePullPolicy: Always
        name: provisioner
        resources:
          limits:
            cpu: '1'
            memory: 10Gi
          requests:
            cpu: 100m
            memory: 1Gi
        volumeMounts:
        - mountPath: /etc/condor/tokens.d/prp-wn.token
          name: configpasswd
          readOnly: true
          subPath: prp-wn.token
        - mountPath: /home/provisioner/osg_provisioner.conf
          name: kconf
          subPath: osg_provisioner.conf
        - mountPath: /var/log/provisioner
          name: log-pvc
      serviceAccountName: prp-htcondor-provisioner
      volumes:
      - name: configpasswd
        secret:
          defaultMode: 256
          items:
          - key: prp-wn.token
            path: prp-wn.token
          secretName: prp-htcondor-wn-secret
      - configMap:
          items:
          - key: osg_provisioner.conf
            path: osg_provisioner.conf
          name: nrao-provisioner-config
        name: kconf
      - name: log-pvc
        persistentVolumeClaim:
          claimName: nrao-provisioner-log-pvc2
