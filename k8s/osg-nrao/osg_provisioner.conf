[DEFAULT]
# Set to yes when the nodes allow unprivileged user namespaces (needed by apptainer)
apptainer=no
k8s_domain=nrp-nautilus.io
app_name=osg-nrao
force_k8s_namespace_matching=no

[k8s]
k8s_image=hub.opensciencegrid.org/osg-htc/nrp-ospool-ep:25-release
priority_class=opportunistic2
node_affinity_dict=nvidia.com/gpu.product:NVIDIA-A10|NVIDIA-GeForce-RTX-3090|NVIDIA-GeForce-RTX-4090|NVIDIA-RTX-A6000|NVIDIA-L40|NVIDIA-A100-PCIE-40GB|NVIDIA-A40
tolerations_list=nautilus.io/noceph
max_submit_pods_per_cluster=100
k8s_job_ttl=3600
use_large_limit=no
labels_dict=applicationId:osg-nrao-wn
service_account_name=prp-htcondor-wn-ro
envs_dict=GLIDEIN_Site:SDSC-PRP,GLIDEIN_ResourceName:SDSC-PRP-OSPool-Provisioner,OSG_SQUID_LOCATION:10.110.90.167&colon;3128,OSG_PROJECT_NAME:NRAO_2022_Bhatnagar
annotations_dict=container.apparmor.security.beta.kubernetes.io/htcondor:unconfined

[htcondor]
schedd_whitelist_regexp=(ap.*\.osg-htc\.org)|(ap.*\.facility\.path-cc\.io)|(path.*\.chtc\.wisc\.edu)
additional_requirements=(ProjectName =?= "NRAO_2022_Bhatnagar")&&((DESIRED_Sites is undefined)||stringListMember("SDSC-PRP",DESIRED_Sites,","))&&((UNDESIRED_Sites is undefined)||!stringListMember("SDSC-PRP",UNDESIRED_Sites,","))&&(!isUndefined(ProjectName))&&((RequestGPUs>0)==true)&&(DESIRED_GPU_MIN_GlobalMemoryMb<=22500)
